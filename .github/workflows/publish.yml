name: Publish Buildpack

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Pack CLI
        uses: buildpacks/github-actions/setup-pack@v5.8.3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from buildpack.toml
        id: meta
        run: |
          VERSION=$(grep '^version' buildpack.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"          # v0.1.0 → 0.1.0
          else
            TAG="latest"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Package and publish
        run: |
          pack buildpack package noman637/buildpack-sonarqube:${{ steps.meta.outputs.tag }} \
            --config package.toml \
            --publish

      - name: Also tag as latest on version tag push
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pack buildpack package noman637/buildpack-sonarqube:latest \
            --config package.toml \
            --publish

